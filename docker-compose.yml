# ============================================================
# GeestuJob — Docker Compose (Développement)
# ============================================================
# Usage:
#   docker compose up -d          → Démarrer tous les services
#   docker compose up -d db       → Démarrer PostgreSQL seul
#   docker compose logs -f api    → Suivre les logs du backend
#   docker compose down -v        → Tout arrêter et supprimer les volumes
# ============================================================

services:
  # ---- PostgreSQL ----
  db:
    image: postgres:16-alpine
    container_name: geestu-job-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---- Backend FastAPI ----
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geestu-job-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POSTGRES_SERVER: db
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - /app/venv
    depends_on:
      db:
        condition: service_healthy

  # ---- Frontend Vite ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: geestu-job-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
    driver: local
